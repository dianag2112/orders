<!doctype html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Magelan user profile">

    <meta name="theme-color"
          content="#000000">

    <title>Магелан — Моят профил</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/styles.css}"
          href="/styles.css">

    <link rel="stylesheet"
          th:href="@{/profile.css(v=2)}"
          href="/profile.css?v=2">

    <link rel="stylesheet"
          th:href="@{/unified-language-font.css}"
          href="/unified-language-font.css">

    <!-- Keep this last -->
    <link rel="stylesheet"
          th:href="@{/shared-footer.css}"
          href="/shared-footer.css">
</head>

<body class="profile-page">

<!-- Language switcher -->
<div class="profile-language-switcher"
     data-aria-bg="Избор на език"
     data-aria-en="Language switcher"
     aria-label="Избор на език">

    <button type="button"
            data-lang-switch="bg">
        БГ
    </button>

    <button type="button"
            data-lang-switch="en">
        EN
    </button>
</div>

<main class="home-center">

    <div class="logo-container">

        <a th:href="@{/home}"
           href="/home"
           data-aria-bg="Към началната страница"
           data-aria-en="Go to the home page"
           aria-label="Към началната страница">

            <img src="/magelan-index.jpg"
                 th:src="@{/magelan-index.jpg}"
                 alt="Magelan Logo"
                 class="logo-image">
        </a>
    </div>

    <section class="panel profile-panel">

        <h1 class="title"
            data-bilingual>
            Моят профил / My Profile
        </h1>

        <!-- Profile update confirmation -->
        <div th:if="${profileUpdated}"
             class="profile-alert"
             role="status">

            <p data-bilingual>
                Профилът е обновен успешно. / Profile updated successfully.
            </p>
        </div>

        <!-- Password update confirmation -->
        <div th:if="${passwordUpdated}"
             class="profile-alert"
             role="status">

            <p data-bilingual>
                Паролата е обновена успешно. / Password updated successfully.
            </p>
        </div>

        <div class="profile-content">

            <div class="profile-main">

                <div class="profile-info">

                    <div class="profile-row">

                        <span class="label"
                              data-bilingual>
                            Потребителско име / Username
                        </span>

                        <span class="value"
                              th:text="${user.username}">
                            username
                        </span>
                    </div>

                    <div class="profile-row">

                        <span class="label"
                              data-bilingual>
                            Парола / Password
                        </span>

                        <span class="value value--secret"
                              aria-hidden="true">
                            ••••••••
                        </span>
                    </div>
                </div>
            </div>

            <div class="profile-actions">

                <a th:href="@{/profile/password}"
                   href="/profile/password"
                   class="btn primary-btn"
                   data-bilingual>
                    Смени паролата / Change Password
                </a>

                <form th:action="@{/logout}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="btn secondary-btn"
                            data-bilingual>
                        Изход / Log Out
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const DEFAULT_LANGUAGE = "bg";

    let currentLanguage =
        DEFAULT_LANGUAGE;


    function splitBilingualHtml(value) {
        const html =
            String(value ?? "").trim();

        const parts =
            html.split(/\s+\/\s+/);

        if (parts.length < 2) {
            return null;
        }

        return {
            bg: parts[0].trim(),

            en: parts
                .slice(1)
                .join(" / ")
                .trim()
        };
    }


    function prepareBilingualElement(element) {
        if (
            element.dataset.bg !== undefined &&
            element.dataset.en !== undefined
        ) {
            return;
        }

        const parts =
            splitBilingualHtml(
                element.innerHTML
            );

        if (!parts) {
            return;
        }

        element.dataset.bg =
            parts.bg;

        element.dataset.en =
            parts.en;
    }


    function applyLanguageToElement(element) {
        prepareBilingualElement(element);

        if (
            element.dataset.bg === undefined ||
            element.dataset.en === undefined
        ) {
            return;
        }

        element.innerHTML =
            currentLanguage === "bg"
                ? element.dataset.bg
                : element.dataset.en;
    }


    function updateAriaLabels() {
        document
            .querySelectorAll(
                "[data-aria-bg][data-aria-en]"
            )
            .forEach(element => {

                const label =
                    currentLanguage === "bg"
                        ? element.dataset.ariaBg
                        : element.dataset.ariaEn;

                element.setAttribute(
                    "aria-label",
                    label
                );

                element.setAttribute(
                    "title",
                    label
                );
            });
    }


    function setLanguage(language) {
        currentLanguage =
            language === "en"
                ? "en"
                : "bg";

        document.documentElement.setAttribute(
            "lang",
            currentLanguage
        );

        localStorage.setItem(
            "lang",
            currentLanguage
        );

        document
            .querySelectorAll(
                "[data-bilingual]"
            )
            .forEach(
                applyLanguageToElement
            );

        updateAriaLabels();

        document.title =
            currentLanguage === "bg"
                ? "Магелан — Моят профил"
                : "Magelan — My Profile";

        document
            .querySelectorAll(
                "[data-lang-switch]"
            )
            .forEach(button => {

                button.classList.toggle(
                    "is-active",
                    button.dataset.langSwitch
                    === currentLanguage
                );
            });
    }


    function initLanguageSwitcher() {
        document
            .querySelectorAll(
                "[data-bilingual]"
            )
            .forEach(
                prepareBilingualElement
            );

        document
            .querySelectorAll(
                "[data-lang-switch]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {
                        setLanguage(
                            button.dataset.langSwitch
                        );
                    }
                );
            });

        setLanguage(
            localStorage.getItem("lang")
            || DEFAULT_LANGUAGE
        );
    }


    document.addEventListener(
        "DOMContentLoaded",
        initLanguageSwitcher
    );
</script>

</body>
</html>
