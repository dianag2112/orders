<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вход — Магелан</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/styles.css}"
          href="/styles.css">

    <link rel="stylesheet"
          th:href="@{/login.css(v=12)}"
          href="/login.css?v=12">

    <link rel="stylesheet"
          th:href="@{/shared-footer.css(v=12)}"
          href="/shared-footer.css?v=12">

    <style>
        .lang-switcher {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1500;

            display: flex;
            gap: 0.5rem;
        }

        .lang-switcher button {
            padding: 0.25rem 0.75rem;

            border: 1px solid #ffffff;
            border-radius: 999px;

            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;

            cursor: pointer;

            font-size: 0.9rem;

            transition:
                    transform 0.15s ease,
                    background 0.15s ease,
                    color 0.15s ease;
        }

        .lang-switcher button:hover {
            transform: translateY(-1px);
        }

        .lang-switcher button.is-active {
            background: #ffffff;
            color: #000000;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .lang-switcher {
                top: 0.75rem;
                right: 0.75rem;
            }

            .lang-switcher button {
                padding: 0.2rem 0.65rem;
                font-size: 0.82rem;
            }
        }
        /* Bulgarian typography — same Cormorant font as the other pages */
        html[lang="bg"] .btn,
        html[lang="bg"] .auth-form-title,
        html[lang="bg"] .auth-button,
        html[lang="bg"] .shared-footer__text,
        html[lang="bg"] .shared-footer__text span {
            font-family: "Cormorant Unicase", serif !important;
            text-transform: none !important;
            letter-spacing: 0 !important;
            font-weight: 600 !important;
        }

        html[lang="bg"] .btn {
            font-size: 1.6rem !important;
            line-height: 1.15 !important;
        }

        html[lang="bg"] .auth-form-title {
            font-size: 2rem !important;
            line-height: 1.2 !important;
        }

        html[lang="bg"] .auth-button {
            font-size: 1.25rem !important;
            line-height: 1.15 !important;
        }
    </style>
</head>

<body class="shared-footer-page"
      data-title-bg="Вход — Магелан"
      data-title-en="Login — Magelan">

<div class="lang-switcher"
     data-aria-bg="Избор на език"
     data-aria-en="Language switcher"
     aria-label="Избор на език">

    <button type="button"
            data-lang-switch="bg">
        БГ
    </button>

    <button type="button"
            data-lang-switch="en">
        EN
    </button>
</div>

<main class="auth-page-content shared-page-content">

    <div class="auth-logo-container">

        <a th:href="@{/}"
           href="/"
           data-aria-bg="Назад към началната страница"
           data-aria-en="Back to the start page"
           aria-label="Назад към началната страница">

            <img src="/magelan-index.jpg"
                 th:src="@{/magelan-index.jpg}"
                 data-alt-bg="Лого на Магелан"
                 data-alt-en="Magelan logo"
                 alt="Лого на Магелан"
                 class="auth-logo-image">
        </a>
    </div>

    <section class="auth-form-wrapper">

        <h1 class="auth-form-title"
            data-bilingual>
            Вход / Login
        </h1>

        <div th:if="${successfulRegistration}"
             class="success-message">

            <p data-bilingual>
                Регистрацията е успешна. Вече можете да влезете. / Registration successful. You can now sign in.
            </p>
        </div>

        <div th:if="${error != null}"
             class="error-message"
             data-bilingual>
            Невалидно потребителско име или парола. / Invalid username or password.
        </div>

        <form th:action="@{/login}"
              method="post"
              class="auth-form">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="auth-form-group">

                <label for="username"
                       class="visually-hidden"
                       data-bilingual>
                    Потребителско име / Username
                </label>

                <input id="username"
                       name="username"
                       type="text"
                       class="auth-form-input"
                       data-placeholder-bg="Потребителско име"
                       data-placeholder-en="Username"
                       placeholder="Потребителско име"
                       autocomplete="username"
                       required>
            </div>

            <div class="auth-form-group">

                <label for="password"
                       class="visually-hidden"
                       data-bilingual>
                    Парола / Password
                </label>

                <input id="password"
                       name="password"
                       type="password"
                       class="auth-form-input"
                       data-placeholder-bg="Парола"
                       data-placeholder-en="Password"
                       placeholder="Парола"
                       autocomplete="current-password"
                       required>
            </div>

            <div class="auth-actions">

                <button type="submit"
                        class="auth-button auth-button--primary"
                        data-bilingual>
                    Вход / Sign in
                </button>
            </div>
        </form>

        <div class="auth-actions auth-back-actions">

            <a th:href="@{/}"
               href="/"
               class="auth-button auth-button--secondary"
               data-bilingual>
                Назад / Back
            </a>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const DEFAULT_LANG = "bg";
        let currentLanguage = DEFAULT_LANG;

        function splitBilingualHtml(value) {
            const html = String(value ?? "").trim();
            const parts = html.split(/\s+\/\s+/);

            if (parts.length < 2) {
                return null;
            }

            return {
                bg: parts[0].trim(),
                en: parts.slice(1).join(" / ").trim()
            };
        }

        function prepareBilingualElement(element) {
            if (
                element.dataset.bg !== undefined &&
                element.dataset.en !== undefined
            ) {
                return;
            }

            const parts = splitBilingualHtml(element.innerHTML);

            if (!parts) {
                return;
            }

            element.dataset.bg = parts.bg;
            element.dataset.en = parts.en;
        }

        function applyLanguageToElement(element) {
            prepareBilingualElement(element);

            if (
                element.dataset.bg === undefined ||
                element.dataset.en === undefined
            ) {
                return;
            }

            element.innerHTML =
                currentLanguage === "bg"
                    ? element.dataset.bg
                    : element.dataset.en;
        }

        function updateTranslatedAttributes() {
            document
                .querySelectorAll(
                    "[data-placeholder-bg][data-placeholder-en]"
                )
                .forEach(element => {
                    element.setAttribute(
                        "placeholder",
                        currentLanguage === "bg"
                            ? element.dataset.placeholderBg
                            : element.dataset.placeholderEn
                    );
                });

            document
                .querySelectorAll("[data-aria-bg][data-aria-en]")
                .forEach(element => {
                    element.setAttribute(
                        "aria-label",
                        currentLanguage === "bg"
                            ? element.dataset.ariaBg
                            : element.dataset.ariaEn
                    );
                });

            document
                .querySelectorAll("[data-alt-bg][data-alt-en]")
                .forEach(element => {
                    element.setAttribute(
                        "alt",
                        currentLanguage === "bg"
                            ? element.dataset.altBg
                            : element.dataset.altEn
                    );
                });
        }

        function setLanguage(language) {
            currentLanguage =
                language === "en" ? "en" : "bg";

            document.documentElement.setAttribute(
                "lang",
                currentLanguage
            );

            localStorage.setItem(
                "lang",
                currentLanguage
            );

            document
                .querySelectorAll("[data-bilingual]")
                .forEach(applyLanguageToElement);

            updateTranslatedAttributes();

            document.title =
                currentLanguage === "bg"
                    ? document.body.dataset.titleBg
                    : document.body.dataset.titleEn;

            document
                .querySelectorAll("[data-lang-switch]")
                .forEach(button => {
                    button.classList.toggle(
                        "is-active",
                        button.dataset.langSwitch === currentLanguage
                    );
                });
        }

        document
            .querySelectorAll("[data-bilingual]")
            .forEach(prepareBilingualElement);

        document
            .querySelectorAll("[data-lang-switch]")
            .forEach(button => {
                button.addEventListener("click", () => {
                    setLanguage(button.dataset.langSwitch);
                });
            });

        setLanguage(
            localStorage.getItem("lang") || DEFAULT_LANG
        );
    });
</script>

</body>
</html>
