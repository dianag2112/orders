<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Магелан</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/styles.css}"
          href="/styles.css">



    <link rel="stylesheet"
          th:href="@{/shared-footer.css(v=12)}"
          href="/shared-footer.css?v=12">

    <style>
        .lang-switcher {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1500;

            display: flex;
            gap: 0.5rem;
        }

        .lang-switcher button {
            padding: 0.25rem 0.75rem;

            border: 1px solid #ffffff;
            border-radius: 999px;

            background: rgba(0, 0, 0, 0.72);
            color: #ffffff;

            cursor: pointer;

            font-size: 0.9rem;

            transition:
                    transform 0.15s ease,
                    background 0.15s ease,
                    color 0.15s ease;
        }

        .lang-switcher button:hover {
            transform: translateY(-1px);
        }

        .lang-switcher button.is-active {
            background: #ffffff;
            color: #000000;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .lang-switcher {
                top: 0.75rem;
                right: 0.75rem;
            }

            .lang-switcher button {
                padding: 0.2rem 0.65rem;
                font-size: 0.82rem;
            }
        }
        /* Bulgarian typography — same Cormorant font as the other pages */
        html[lang="bg"] .btn,
        html[lang="bg"] .auth-form-title,
        html[lang="bg"] .auth-button,
        html[lang="bg"] .shared-footer__text,
        html[lang="bg"] .shared-footer__text span {
            font-family: "Cormorant Unicase", serif !important;
            text-transform: none !important;
            letter-spacing: 0 !important;
            font-weight: 600 !important;
        }

        html[lang="bg"] .btn {
            font-size: 1.6rem !important;
            line-height: 1.15 !important;
        }

        html[lang="bg"] .auth-form-title {
            font-size: 2rem !important;
            line-height: 1.2 !important;
        }

        html[lang="bg"] .auth-button {
            font-size: 1.25rem !important;
            line-height: 1.15 !important;
        }
        html[lang="bg"] .register-btn {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;

            padding-left: 18px !important;
            padding-right: 18px !important;

            text-align: center !important;
            white-space: nowrap;
        }
    </style>
</head>

<body class="shared-footer-page"
      data-title-bg="Магелан"
      data-title-en="Magelan">

<div class="lang-switcher"
     data-aria-bg="Избор на език"
     data-aria-en="Language switcher"
     aria-label="Избор на език">

    <button type="button"
            data-lang-switch="bg">
        БГ
    </button>

    <button type="button"
            data-lang-switch="en">
        EN
    </button>
</div>

<main class="container shared-page-content">

    <div class="logo-container">

        <img src="/magelan-index.jpg"
             th:src="@{/magelan-index.jpg}"
             data-alt-bg="Лого на Магелан"
             data-alt-en="Magelan logo"
             alt="Лого на Магелан"
             class="logo-image">
    </div>

    <div class="buttons">

        <a class="btn login-btn"
           th:href="@{/login}"
           href="/login"
           data-bilingual>
            Вход / Login
        </a>

        <a class="btn register-btn"
           th:href="@{/register}"
           href="/register"
           data-bilingual>
            Регистрация / Register
        </a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const DEFAULT_LANG = "bg";
        let currentLanguage = DEFAULT_LANG;

        function splitBilingualHtml(value) {
            const html = String(value ?? "").trim();
            const parts = html.split(/\s+\/\s+/);

            if (parts.length < 2) {
                return null;
            }

            return {
                bg: parts[0].trim(),
                en: parts.slice(1).join(" / ").trim()
            };
        }

        function prepareBilingualElement(element) {
            if (
                element.dataset.bg !== undefined &&
                element.dataset.en !== undefined
            ) {
                return;
            }

            const parts = splitBilingualHtml(element.innerHTML);

            if (!parts) {
                return;
            }

            element.dataset.bg = parts.bg;
            element.dataset.en = parts.en;
        }

        function applyLanguageToElement(element) {
            prepareBilingualElement(element);

            if (
                element.dataset.bg === undefined ||
                element.dataset.en === undefined
            ) {
                return;
            }

            element.innerHTML =
                currentLanguage === "bg"
                    ? element.dataset.bg
                    : element.dataset.en;
        }

        function updateTranslatedAttributes() {
            document
                .querySelectorAll("[data-aria-bg][data-aria-en]")
                .forEach(element => {
                    element.setAttribute(
                        "aria-label",
                        currentLanguage === "bg"
                            ? element.dataset.ariaBg
                            : element.dataset.ariaEn
                    );
                });

            document
                .querySelectorAll("[data-alt-bg][data-alt-en]")
                .forEach(element => {
                    element.setAttribute(
                        "alt",
                        currentLanguage === "bg"
                            ? element.dataset.altBg
                            : element.dataset.altEn
                    );
                });
        }

        function setLanguage(language) {
            currentLanguage =
                language === "en" ? "en" : "bg";

            document.documentElement.setAttribute(
                "lang",
                currentLanguage
            );

            localStorage.setItem(
                "lang",
                currentLanguage
            );

            document
                .querySelectorAll("[data-bilingual]")
                .forEach(applyLanguageToElement);

            updateTranslatedAttributes();

            document.title =
                currentLanguage === "bg"
                    ? document.body.dataset.titleBg
                    : document.body.dataset.titleEn;

            document
                .querySelectorAll("[data-lang-switch]")
                .forEach(button => {
                    button.classList.toggle(
                        "is-active",
                        button.dataset.langSwitch === currentLanguage
                    );
                });
        }

        document
            .querySelectorAll("[data-bilingual]")
            .forEach(prepareBilingualElement);

        document
            .querySelectorAll("[data-lang-switch]")
            .forEach(button => {
                button.addEventListener("click", () => {
                    setLanguage(button.dataset.langSwitch);
                });
            });

        setLanguage(
            localStorage.getItem("lang") || DEFAULT_LANG
        );
    });
</script>

</body>
</html>
