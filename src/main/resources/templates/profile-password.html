<!doctype html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Change your Magelan account password">

    <meta name="theme-color"
          content="#000000">

    <title>Магелан — Смяна на парола</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/styles.css}"
          href="/styles.css">

    <link rel="stylesheet"
          th:href="@{/change-password.css(v=1)}"
          href="/change-password.css?v=1">

    <link rel="stylesheet"
          th:href="@{/unified-language-font.css}"
          href="/unified-language-font.css">

    <!-- Keep this last -->
    <link rel="stylesheet"
          th:href="@{/shared-footer.css}"
          href="/shared-footer.css">
</head>

<body class="password-page">

<!-- Language switcher -->
<div class="password-language-switcher"
     data-aria-bg="Избор на език"
     data-aria-en="Language switcher"
     aria-label="Избор на език">

    <button type="button"
            data-lang-switch="bg">
        БГ
    </button>

    <button type="button"
            data-lang-switch="en">
        EN
    </button>
</div>

<main class="password-page-content">

    <!-- Logo -->
    <div class="password-logo-container">

        <a th:href="@{/home}"
           href="/home"
           data-aria-bg="Към началната страница"
           data-aria-en="Go to the home page"
           aria-label="Към началната страница">

            <img class="password-logo-image"
                 src="/magelan-index.jpg"
                 th:src="@{/magelan-index.jpg}"
                 alt="Magelan Logo">
        </a>
    </div>

    <!-- Password panel -->
    <section class="password-panel">

        <header class="password-panel__header">

            <h1 class="password-title"
                data-bilingual>
                Смяна на парола / Change Password
            </h1>

            <p class="password-subtitle"
               data-bilingual>
                Въведете настоящата си парола и изберете нова. / Enter your current password and choose a new one.
            </p>
        </header>

        <!-- General password error from the controller -->
        <div th:if="${passwordError}"
             class="password-alert password-alert--error"
             role="alert">

            <span class="password-alert__icon"
                  aria-hidden="true">
                !
            </span>

            <p th:text="${passwordError}">
                The password could not be changed.
            </p>
        </div>

        <form class="password-form"
              th:action="@{/profile/password}"
              method="post"
              th:object="${changePasswordRequest}">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Current password -->
            <div class="password-form-group">

                <label for="currentPassword"
                       class="password-label"
                       data-bilingual>
                    Настояща парола / Current Password
                </label>

                <div class="password-input-wrapper">

                    <input id="currentPassword"
                           class="password-input"
                           type="password"
                           autocomplete="current-password"
                           data-placeholder-bg="Въведете настоящата парола"
                           data-placeholder-en="Enter your current password"
                           placeholder="Въведете настоящата парола"
                           th:field="*{currentPassword}"
                           required>

                    <button type="button"
                            class="password-visibility-button"
                            data-password-toggle="currentPassword"
                            data-show-bg="Покажи паролата"
                            data-show-en="Show password"
                            data-hide-bg="Скрий паролата"
                            data-hide-en="Hide password"
                            aria-label="Покажи паролата">
                        <span aria-hidden="true">◉</span>
                    </button>
                </div>

                <div class="field-error"
                     th:if="${#fields.hasErrors('currentPassword')}"
                     th:errors="*{currentPassword}">
                    Current password error
                </div>
            </div>

            <!-- New password -->
            <div class="password-form-group">

                <label for="newPassword"
                       class="password-label"
                       data-bilingual>
                    Нова парола / New Password
                </label>

                <div class="password-input-wrapper">

                    <input id="newPassword"
                           class="password-input"
                           type="password"
                           autocomplete="new-password"
                           data-placeholder-bg="Въведете новата парола"
                           data-placeholder-en="Enter your new password"
                           placeholder="Въведете новата парола"
                           th:field="*{newPassword}"
                           required>

                    <button type="button"
                            class="password-visibility-button"
                            data-password-toggle="newPassword"
                            data-show-bg="Покажи паролата"
                            data-show-en="Show password"
                            data-hide-bg="Скрий паролата"
                            data-hide-en="Hide password"
                            aria-label="Покажи паролата">
                        <span aria-hidden="true">◉</span>
                    </button>
                </div>

                <div class="field-error"
                     th:if="${#fields.hasErrors('newPassword')}"
                     th:errors="*{newPassword}">
                    New password error
                </div>
            </div>

            <!-- Confirm password -->
            <div class="password-form-group">

                <label for="confirmNewPassword"
                       class="password-label"
                       data-bilingual>
                    Потвърдете новата парола / Confirm New Password
                </label>

                <div class="password-input-wrapper">

                    <input id="confirmNewPassword"
                           class="password-input"
                           type="password"
                           autocomplete="new-password"
                           data-placeholder-bg="Въведете новата парола отново"
                           data-placeholder-en="Enter your new password again"
                           placeholder="Въведете новата парола отново"
                           th:field="*{confirmNewPassword}"
                           required>

                    <button type="button"
                            class="password-visibility-button"
                            data-password-toggle="confirmNewPassword"
                            data-show-bg="Покажи паролата"
                            data-show-en="Show password"
                            data-hide-bg="Скрий паролата"
                            data-hide-en="Hide password"
                            aria-label="Покажи паролата">
                        <span aria-hidden="true">◉</span>
                    </button>
                </div>

                <div class="field-error"
                     th:if="${#fields.hasErrors('confirmNewPassword')}"
                     th:errors="*{confirmNewPassword}">
                    Password confirmation error
                </div>
            </div>

            <div class="password-actions">

                <button type="submit"
                        class="password-button password-button--primary"
                        data-bilingual>
                    Запази новата парола / Save New Password
                </button>

                <a th:href="@{/profile}"
                   href="/profile"
                   class="password-button password-button--secondary"
                   data-bilingual>
                    Назад към профила / Back to Profile
                </a>
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const DEFAULT_LANGUAGE = "bg";

    let currentLanguage =
        DEFAULT_LANGUAGE;


    function splitBilingualHtml(value) {
        const html =
            String(value ?? "").trim();

        const parts =
            html.split(/\s+\/\s+/);

        if (parts.length < 2) {
            return null;
        }

        return {
            bg: parts[0].trim(),

            en: parts
                .slice(1)
                .join(" / ")
                .trim()
        };
    }


    function prepareBilingualElement(element) {
        if (
            element.dataset.bg !== undefined &&
            element.dataset.en !== undefined
        ) {
            return;
        }

        const parts =
            splitBilingualHtml(
                element.innerHTML
            );

        if (!parts) {
            return;
        }

        element.dataset.bg =
            parts.bg;

        element.dataset.en =
            parts.en;
    }


    function applyLanguageToElement(element) {
        prepareBilingualElement(element);

        if (
            element.dataset.bg === undefined ||
            element.dataset.en === undefined
        ) {
            return;
        }

        element.innerHTML =
            currentLanguage === "bg"
                ? element.dataset.bg
                : element.dataset.en;
    }


    function updateAriaLabels() {
        document
            .querySelectorAll(
                "[data-aria-bg][data-aria-en]"
            )
            .forEach(element => {

                const label =
                    currentLanguage === "bg"
                        ? element.dataset.ariaBg
                        : element.dataset.ariaEn;

                element.setAttribute(
                    "aria-label",
                    label
                );

                element.setAttribute(
                    "title",
                    label
                );
            });
    }


    function updateBilingualPlaceholders() {
        document
            .querySelectorAll(
                "[data-placeholder-bg][data-placeholder-en]"
            )
            .forEach(element => {

                element.placeholder =
                    currentLanguage === "bg"
                        ? element.dataset.placeholderBg
                        : element.dataset.placeholderEn;
            });
    }


    function updatePasswordToggleLabels() {
        document
            .querySelectorAll(
                "[data-password-toggle]"
            )
            .forEach(button => {

                const input =
                    document.getElementById(
                        button.dataset.passwordToggle
                    );

                if (!input) {
                    return;
                }

                const passwordIsVisible =
                    input.type === "text";

                let label;

                if (passwordIsVisible) {
                    label =
                        currentLanguage === "bg"
                            ? button.dataset.hideBg
                            : button.dataset.hideEn;
                } else {
                    label =
                        currentLanguage === "bg"
                            ? button.dataset.showBg
                            : button.dataset.showEn;
                }

                button.setAttribute(
                    "aria-label",
                    label
                );

                button.setAttribute(
                    "title",
                    label
                );
            });
    }


    function setLanguage(language) {
        currentLanguage =
            language === "en"
                ? "en"
                : "bg";

        document.documentElement.setAttribute(
            "lang",
            currentLanguage
        );

        localStorage.setItem(
            "lang",
            currentLanguage
        );

        document
            .querySelectorAll(
                "[data-bilingual]"
            )
            .forEach(
                applyLanguageToElement
            );

        updateAriaLabels();
        updateBilingualPlaceholders();
        updatePasswordToggleLabels();

        document.title =
            currentLanguage === "bg"
                ? "Магелан — Смяна на парола"
                : "Magelan — Change Password";

        document
            .querySelectorAll(
                "[data-lang-switch]"
            )
            .forEach(button => {

                button.classList.toggle(
                    "is-active",
                    button.dataset.langSwitch
                    === currentLanguage
                );
            });
    }


    function initLanguageSwitcher() {
        document
            .querySelectorAll(
                "[data-bilingual]"
            )
            .forEach(
                prepareBilingualElement
            );

        document
            .querySelectorAll(
                "[data-lang-switch]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {
                        setLanguage(
                            button.dataset.langSwitch
                        );
                    }
                );
            });

        setLanguage(
            localStorage.getItem("lang")
            || DEFAULT_LANGUAGE
        );
    }


    function initPasswordVisibilityButtons() {
        document
            .querySelectorAll(
                "[data-password-toggle]"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const input =
                            document.getElementById(
                                button.dataset.passwordToggle
                            );

                        if (!input) {
                            return;
                        }

                        input.type =
                            input.type === "password"
                                ? "text"
                                : "password";

                        button.classList.toggle(
                            "is-visible",
                            input.type === "text"
                        );

                        updatePasswordToggleLabels();
                    }
                );
            });
    }


    document.addEventListener(
        "DOMContentLoaded",
        () => {
            initLanguageSwitcher();
            initPasswordVisibilityButtons();
        }
    );
</script>

</body>
</html>
