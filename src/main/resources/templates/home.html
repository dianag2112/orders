<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Магелан — Начало</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/styles.css}"
          href="/styles.css">

    <link rel="stylesheet"
          th:href="@{/home.css}"
          href="/home.css">

    <!-- Keep this after the other CSS files -->
    <link rel="stylesheet"
          th:href="@{/unified-language-font.css}"
          href="/unified-language-font.css">

    <link rel="stylesheet"
          th:href="@{/shared-footer.css}"
          href="/shared-footer.css">

    <style>
        .home-language-switcher {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 2000;

            display: flex;
            gap: 8px;
        }

        .home-language-switcher button {
            min-width: 48px;
            padding: 7px 13px;

            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;

            background: rgba(0, 0, 0, 0.78);
            color: #ffffff;

            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;

            transition:
                    transform 0.15s ease,
                    background 0.15s ease,
                    color 0.15s ease;
        }

        .home-language-switcher button:hover {
            transform: translateY(-1px);
        }

        .home-language-switcher button.is-active {
            background: #ffffff;
            color: #000000;
        }

        @media (max-width: 640px) {
            .home-language-switcher {
                position: absolute;
                top: 12px;
                right: 12px;
            }

            .home-language-switcher button {
                min-width: 43px;
                padding: 6px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body class="home-page">

<!-- Language switch -->
<div class="home-language-switcher"
     data-aria-bg="Избор на език"
     data-aria-en="Language switcher"
     aria-label="Избор на език">

    <button type="button"
            data-lang-switch="bg">
        БГ
    </button>

    <button type="button"
            data-lang-switch="en">
        EN
    </button>
</div>

<header class="top-logo">

    <img src="/magelan-index.jpg"
         th:src="@{/magelan-index.jpg}"
         alt="Magelan Logo"
         class="top-logo__img">

    <div class="top-logo__subtitle"
         data-bilingual>
        Конзола за поръчки / Pirate Orders Console
    </div>
</header>

<div class="bg"
     aria-hidden="true">
</div>

<main class="wrap">

    <section class="hero">

        <h1 class="title"
            data-bilingual>
            Добре дошли на борда, капитане. / Welcome aboard, Captain.
        </h1>
    </section>

    <section class="panel">

        <nav class="tiles"
             data-aria-bg="Основни действия"
             data-aria-en="Main actions"
             aria-label="Основни действия">

            <!-- Menu -->
            <a class="tile"
               th:href="@{/menu}"
               href="/menu">

                <span class="tile__icon"
                      aria-hidden="true">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M4 13a8 8 0 0 0 16 0H4zM9 4c0 1 1 1 1 2s-1 1-1 2m5-4c0 1 1 1 1 2s-1 1-1 2"/>
                    </svg>
                </span>

                <span class="tile__label"
                      data-bilingual>
                    Меню / Menu
                </span>
            </a>

            <!-- Pending orders -->
            <a class="tile tile--primary"
               th:href="@{/orders/pending}"
               href="/orders/pending">

                <span class="tile__icon"
                      aria-hidden="true">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M4 4h16v16H4zM4 9h16M9 9V4m6 5V4"/>
                    </svg>
                </span>

                <span class="tile__label"
                      data-bilingual>
                    Текущи поръчки / Pending Orders
                </span>
            </a>

            <!-- Completed orders -->
            <a class="tile"
               th:href="@{/orders/completed}"
               href="/orders/completed">

                <span class="tile__icon"
                      aria-hidden="true">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M5 13l4 4L19 7"/>
                    </svg>
                </span>

                <span class="tile__label"
                      data-bilingual>
                    Завършени поръчки / Completed Orders
                </span>
            </a>

            <!-- Profile -->
            <a class="tile"
               th:href="@{/profile}"
               href="/profile">

                <span class="tile__icon"
                      aria-hidden="true">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">

                        <circle cx="12"
                                cy="8"
                                r="4"/>

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
                    </svg>
                </span>

                <span class="tile__label"
                      data-bilingual>
                    Профил / Profile
                </span>
            </a>
        </nav>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const DEFAULT_LANGUAGE = "bg";

    let currentLanguage = DEFAULT_LANGUAGE;


    /*
     * Separates:
     *
     * Bulgarian text / English text
     *
     * Only a slash with spaces around it is treated
     * as the language separator.
     */
    function splitBilingualHtml(value) {
        const html = String(value ?? "").trim();

        const parts = html.split(/\s+\/\s+/);

        if (parts.length < 2) {
            return null;
        }

        return {
            bg: parts[0].trim(),
            en: parts.slice(1).join(" / ").trim()
        };
    }


    /*
     * Saves both language versions before changing
     * the visible content.
     */
    function prepareBilingualElement(element) {
        if (
            element.dataset.bg !== undefined &&
            element.dataset.en !== undefined
        ) {
            return;
        }

        const parts =
            splitBilingualHtml(element.innerHTML);

        if (!parts) {
            return;
        }

        element.dataset.bg = parts.bg;
        element.dataset.en = parts.en;
    }


    function applyLanguageToElement(element) {
        prepareBilingualElement(element);

        if (
            element.dataset.bg === undefined ||
            element.dataset.en === undefined
        ) {
            return;
        }

        element.innerHTML =
            currentLanguage === "bg"
                ? element.dataset.bg
                : element.dataset.en;
    }


    function updateAriaLabels() {
        document
            .querySelectorAll(
                "[data-aria-bg][data-aria-en]"
            )
            .forEach(element => {

                const label =
                    currentLanguage === "bg"
                        ? element.dataset.ariaBg
                        : element.dataset.ariaEn;

                element.setAttribute(
                    "aria-label",
                    label
                );
            });
    }


    function setLanguage(language) {
        currentLanguage =
            language === "en"
                ? "en"
                : "bg";

        /*
         * unified-language-font.css detects this
         * attribute and applies Cormorant Unicase
         * when Bulgarian is selected.
         */
        document.documentElement.setAttribute(
            "lang",
            currentLanguage
        );

        /*
         * The language is shared with the menu,
         * pending-orders and completed-orders pages.
         */
        localStorage.setItem(
            "lang",
            currentLanguage
        );

        document
            .querySelectorAll("[data-bilingual]")
            .forEach(applyLanguageToElement);

        updateAriaLabels();

        document.title =
            currentLanguage === "bg"
                ? "Магелан — Начало"
                : "Home — Magelan";

        document
            .querySelectorAll("[data-lang-switch]")
            .forEach(button => {

                button.classList.toggle(
                    "is-active",
                    button.dataset.langSwitch
                    === currentLanguage
                );
            });
    }


    function initLanguageSwitcher() {
        /*
         * Save both versions before displaying
         * only the selected one.
         */
        document
            .querySelectorAll("[data-bilingual]")
            .forEach(prepareBilingualElement);

        document
            .querySelectorAll("[data-lang-switch]")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {
                        setLanguage(
                            button.dataset.langSwitch
                        );
                    }
                );
            });

        const savedLanguage =
            localStorage.getItem("lang")
            || DEFAULT_LANGUAGE;

        setLanguage(savedLanguage);
    }


    document.addEventListener(
        "DOMContentLoaded",
        initLanguageSwitcher
    );
</script>

</body>
</html>
