spring.application.name=orders

server.port=${PORT:8080}

# =========================================================
# DATABASE / JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# =========================================================
# HIKARI DATABASE CONNECTION POOL
#
# Magelan does not need a large connection pool.
# Keeping this small reduces memory usage.
# =========================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000


# =========================================================
# TOMCAT
#
# Spring Boot's default maximum is 200 worker threads.
# That is far more than Magelan needs and is wasteful
# on a 512 MB Render instance.
# =========================================================

server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.tomcat.processor-cache=30